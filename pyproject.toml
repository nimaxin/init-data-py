[project]
name = "init-data-py"
description = "A Python library that provides tools for using and validating Telegram Mini App init data."
authors = [
    { name = "nimaxin", email = "nimaxin@proton.me" }
]
dependencies = []
readme = "README.md"
requires-python = ">= 3.9"
license = "MIT"
license-files = ["LICENCE"]
keywords = [
    "telegram",
    "telegram-mini-app",
    "telegram-web-app",
    "init-data",
    "webappinitdata",
    "authentication",
    "validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.optional-dependencies]
ed25519 = ["cryptography>=41.0"]

[project.urls]
Homepage = "https://github.com/nimaxin/init-data-py"
Repository = "https://github.com/nimaxin/init-data-py"
Issues = "https://github.com/nimaxin/init-data-py/issues"
Changelog = "https://github.com/nimaxin/init-data-py/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.5.7",
]

[tool.hatch.version]
path = "src/init_data_py/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/init_data_py"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 79
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001"]
fixable = ["ALL"]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true

# Legacy 0.2.x modules; delete each entry as its module is replaced.
[[tool.mypy.overrides]]
module = [
    "init_data_py.init_data",
    "init_data_py.errors.*",
    "init_data_py.types.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
